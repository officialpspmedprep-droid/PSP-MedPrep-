name: psp_medprep
description: PSP MedPrep Android app
version: 1.0.0+1
publish_to: 'none' # Do not publish to pub.dev

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Flutter essentials
  cupertino_icons: ^1.0.5
  provider: ^6.0.5

  # PDF viewing & text extraction (null-safe)
  pdfx: ^2.6.0

  # HTTP requests
  http: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
