name: psp_medprep
description: PSP‑MedPrep Android App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # PDF rendering
  pdfx: ^2.9.2

  # State management
  provider: ^7.0.0

  # HTTP requests
  http: ^1.0.0

  # Launch URLs (web, email, etc)
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/papers/
    - assets/notes/
    - assets/mock_tests/
